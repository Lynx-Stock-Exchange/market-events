plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lynx.team2'
version = '0.0.1-SNAPSHOT'
description = 'market-event'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web (REST controllers)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // JPA + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Bean Validation (Jakarta)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Kafka (Spring for Apache Kafka — there is no spring-boot-starter-kafka)
    implementation 'org.springframework.kafka:spring-kafka'
    // Actuator: /actuator/health, /actuator/info — useful for prod and tests
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'         // dev / default profile
    runtimeOnly 'org.postgresql:postgresql' // prod profile

    // Tests: spring-boot-starter-test bundles JUnit 5, AssertJ, Mockito, Spring Test, etc.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
