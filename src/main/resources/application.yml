server:
  port: 8081

spring:
  application:
    name: market-events

  datasource:
    url: jdbc:h2:mem:market_events_db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true   # available at http://localhost:8081/h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

market:
  simulation:


    tick-interval-ms: 1000
    expiration-scheduler-rate: 30000

