services:
  kafka:
    image: bitnamilegacy/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=Lynx-Local-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  # Used by the `prod` Spring profile (application-prod.yml).
  # Default profile (dev) still uses an in-memory H2 — postgres is opt-in.
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=market_events
      - POSTGRES_USER=market_events
      - POSTGRES_PASSWORD=market_events
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Market Events Java service itself. Built from the local Dockerfile.
  # Brings up the whole stack with `docker compose up -d`.
  # To run with PostgreSQL instead of H2, set SPRING_PROFILES_ACTIVE=prod below.
  market-events:
    build: .
    ports:
      - "8082:8082"
    environment:
      # Kafka inside the docker network is at kafka:29092 (not localhost:9092).
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Postgres connection details — only used if SPRING_PROFILES_ACTIVE=prod.
      - MARKET_EVENTS_DB_URL=jdbc:postgresql://postgres:5432/market_events
      - MARKET_EVENTS_DB_USER=market_events
      - MARKET_EVENTS_DB_PASSWORD=market_events
    depends_on:
      - kafka
      - postgres

volumes:
  postgres_data:
